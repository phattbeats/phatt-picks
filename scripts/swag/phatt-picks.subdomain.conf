# SWAG subdomain config for phaTT Picks → https://pickems.phatt.vip
# Drop this at /mnt/user/appdata/swag/nginx/proxy-confs/phatt-picks.subdomain.conf
# and reload SWAG (`docker restart swag` or `nginx -s reload` inside the container).
#
# Requirements:
#   - SWAG container is on the `phattvip` Docker network (so `phatt-picks` resolves by name).
#   - phatt-picks container is named exactly `phatt-picks` and listens on :3000 inside the container.
#   - DNS for `pickems.phatt.vip` points at the SWAG host; the wildcard SSL cert covers `*.phatt.vip`.
#
# Matches NEXTAUTH_URL=https://pickems.phatt.vip in scripts/phatt-picks.unraid.xml.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name pickems.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app phatt-picks;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
